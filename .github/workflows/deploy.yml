name: Deploy SentinelSight

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run health check
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        PID=$!
        sleep 10
        curl http://localhost:8000/health || { kill $PID; exit 1; }
        kill $PID
    
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        docker build -t sentinelsight:latest .
    
    - name: Test Docker image
      run: |
        docker run -d -p 8000:8000 --name test-sentinel sentinelsight:latest
        sleep 10
        curl http://localhost:8000/health || exit 1
        docker stop test-sentinel
        docker rm test-sentinel
